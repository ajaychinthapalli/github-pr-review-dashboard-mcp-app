<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Review Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .repo-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b949e;
      font-size: 14px;
    }

    .filters {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 12px;
      color: #8b949e;
      font-weight: 500;
    }

    select, input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #1f6feb;
    }

    .pr-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pr-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      transition: border-color 0.2s;
    }

    .pr-card:hover {
      border-color: #8b949e;
    }

    .pr-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .pr-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .pr-title h3 {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      cursor: pointer;
      margin: 0;
    }

    .pr-title h3:hover {
      text-decoration: underline;
    }

    .pr-number {
      color: #8b949e;
      font-size: 14px;
    }

    .pr-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .pr-author {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .pr-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-add {
      color: #3fb950;
    }

    .stat-del {
      color: #f85149;
    }

    .pr-reviewers {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .reviewer {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d1117;
      padding: 4px 8px;
      border-radius: 16px;
      font-size: 12px;
    }

    .pr-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #30363d;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #238636;
      color: white;
      border-color: #238636;
    }

    .btn-primary:hover {
      background: #2ea043;
    }

    .btn-secondary {
      background: transparent;
      color: #c9d1d9;
      border-color: #30363d;
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    .btn-danger {
      background: #da3633;
      color: white;
      border-color: #da3633;
    }

    .btn-danger:hover {
      background: #f85149;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-draft {
      background: #6e7681;
      color: white;
    }

    .badge-approved {
      background: #238636;
      color: white;
    }

    .badge-changes {
      background: #da3633;
      color: white;
    }

    .badge-pending {
      background: #9e6a03;
      color: white;
    }

    .badge-success {
      background: #2ea043;
      color: white;
    }

    .badge-failure {
      background: #f85149;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
    }

    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #c9d1d9;
    }

    .labels {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .label {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Pull Request Dashboard</h1>
      <div class="repo-info" id="repo-info"></div>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label>State</label>
        <select id="filter-state">
          <option value="open">Open</option>
          <option value="closed">Closed</option>
          <option value="all">All</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Sort by</label>
        <select id="filter-sort">
          <option value="created">Recently Created</option>
          <option value="updated">Recently Updated</option>
          <option value="popularity">Most Popular</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Author</label>
        <input type="text" id="filter-author" placeholder="Filter by author...">
      </div>
      <div class="filter-group">
        <label>Reviewer</label>
        <input type="text" id="filter-reviewer" placeholder="Filter by reviewer...">
      </div>
    </div>

    <div id="pr-list" class="pr-list">
      <div class="loading">Loading pull requests...</div>
    </div>
  </div>

  <script type="module" src="/src/pr-dashboard.ts"></script>
</body>
</html>
